services:
  trial-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: genasis-trial-app:latest
    # container_name omitted intentionally so COMPOSE_PROJECT_NAME
    # (set via .env or shell) auto-namespaces the container in
    # multi-tenant deploys.
    restart: unless-stopped
    ports:
      - "${TRIAL_APP_PORT:-3000}:3000"
    environment:
      DATABASE_PATH: /data/trial.db
      MM_BOT_TOKEN: ${MM_BOT_TOKEN:-}
      MM_TRIAL_CHANNEL_ID: ${MM_TRIAL_CHANNEL_ID:-}
      MM_BASE_URL: ${MM_BASE_URL:-https://mm.realstory.blog}
      WEBHOOK_SHARED_SECRET: ${WEBHOOK_SHARED_SECRET:-}
      TRIAL_SHARED_SECRET: ${TRIAL_SHARED_SECRET:-}
    volumes:
      - trial-app-data:/data

volumes:
  trial-app-data:
