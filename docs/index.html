  <!-- Accept-Language redirect (client-side fallback because GitHub
       Pages doesn't read request headers; navigator.language is the
       closest signal). -->
  <script>
    (function () {
      try {
        var lang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
        var target = lang.indexOf('ko') === 0 ? 'ko/' : 'en/';
        var here = location.pathname.replace(/\/$/, '');
        if (here === '/genasis' || here === '') {
          location.replace(target);
        }
      } catch (e) {
        location.replace('en/');
      }
    })();
  </script>
