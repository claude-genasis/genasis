[workspace]
resolver = "2"
members = [
    "crates/genasis-cli",
    "crates/genasis-core",
    "crates/genasis-overlay",
    "crates/genasis-providers",
    "crates/genasis-db",
    "crates/genasis-design",
    "crates/genasis-tui",
    "crates/genasis-monitor",
    "crates/genasis-templates",
    "crates/genasis-i18n",
    "tests/e2e",
]

[workspace.package]
version = "0.5.16"
edition = "2021"
rust-version = "1.78"
license = "MIT"
repository = "https://github.com/claude-genasis/genasis"
homepage = "https://github.com/claude-genasis/genasis"
authors = ["Genasis contributors"]

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "time", "io-util", "io-std", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest-eventsource = { version = "0.6", default-features = false }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tera = "1"
clap = { version = "4", features = ["derive", "env"] }
ratatui = "=0.27.0"
crossterm = "=0.27.0"
tui-textarea = "=0.4.0"
tui-input = "=0.8.0"
notify = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
dirs = "5"
indexmap = { version = "2", features = ["serde"] }
walkdir = "2"
regex = "1"
include_dir = "0.7"
tempfile = "3"
which = "6"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
rust-i18n = "3"
once_cell = "1"

# Workspace internal
genasis-core = { path = "crates/genasis-core" }
genasis-i18n = { path = "crates/genasis-i18n" }
genasis-overlay = { path = "crates/genasis-overlay" }
genasis-providers = { path = "crates/genasis-providers" }
genasis-db = { path = "crates/genasis-db" }
genasis-design = { path = "crates/genasis-design" }
genasis-tui = { path = "crates/genasis-tui" }
genasis-monitor = { path = "crates/genasis-monitor" }
genasis-templates = { path = "crates/genasis-templates" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
