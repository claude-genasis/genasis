# agents-pool configuration — sourcing targets for agent curation.
#
# This file defines which repositories to crawl, what paths to look at,
# and which branch/tag to use. The crawl.sh script reads this file.

[meta]
description = "Genasis agents-pool: private curation pipeline"
output_dir = "../agents"  # relative to agents-pool/ root

# Each [[source]] entry defines one upstream agent repository to crawl.

[[source]]
name = "ecc"
repo = "https://github.com/affaan-m/everything-claude-code.git"
branch = "main"
paths = ["agents/"]
license = "MIT"
roles = ["code-reviewer", "architect", "security-reviewer", "planner"]

[[source]]
name = "wshobson"
repo = "https://github.com/wshobson/agents.git"
branch = "main"
paths = [
  "plugins/frontend-mobile-development/agents/",
  "plugins/backend-development/agents/",
  "plugins/full-stack-orchestration/agents/",
]
license = "MIT"
roles = ["frontend-developer", "backend-developer"]

[[source]]
name = "voltagent"
repo = "https://github.com/VoltAgent/awesome-claude-code-subagents.git"
branch = "main"
paths = [
  "categories/04-quality-security/",
  "categories/03-infrastructure/",
]
license = "MIT"
roles = ["qa-tester", "devops"]

[[source]]
name = "dl-ezo"
repo = "https://github.com/dl-ezo/claude-code-sub-agents.git"
branch = "main"
paths = ["."]
license = "MIT"
roles = ["planner"]

[[source]]
name = "0xfurai"
repo = "https://github.com/0xfurai/claude-code-subagents.git"
branch = "main"
paths = ["agents/"]
license = "MIT"
roles = ["mobile-ios", "mobile-android"]
