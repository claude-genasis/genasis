name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  lint-i18n-strict:
    runs-on: ubuntu-latest
    name: i18n drift (HARD FAIL at tag time)
    steps:
      - uses: actions/checkout@v4
      - name: Reject Korean text in English source files
        run: |
          OFFENDERS=$(grep -rEnP "[\\x{AC00}-\\x{D7AF}]" \
               --include="*.md" --include="*.tera" --include="*.rs" --include="*.sh" \
               --include="*.yml" \
               --exclude="*.ko.md" \
               --exclude="ko.yml" \
               --exclude-dir="ko" --exclude-dir="target" --exclude-dir="node_modules" \
               . || true)
          if [ -n "$OFFENDERS" ]; then
            echo "::error::Korean text found in English source files:"
            echo "$OFFENDERS"
            exit 1
          fi
      - name: Mirror completeness (HARD FAIL)
        run: scripts/check-i18n-drift.sh --strict
      - name: i18n key parity (HARD FAIL)
        run: scripts/i18n-extract-keys.sh --strict

  build:
    needs: lint-i18n-strict
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux pre-built binaries are statically linked against musl
          # libc so the same tarball runs unchanged on every glibc
          # version (Alpine 3.x, CentOS 7 [glibc 2.17], RHEL 8,
          # Debian 10+, Ubuntu 18.04+, Amazon Linux 2, …). Without
          # this, GitHub's ubuntu-latest (currently 24.04 / glibc 2.39)
          # would bake a GLIBC_2.39 dynamic-link floor into the binary
          # and break every older distro. `cross` picks the musl
          # cross-compile image automatically when the target ends in
          # -musl, so we don't need to install musl-tools by hand.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_name: genasis-linux-x86_64
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset_name: genasis-linux-aarch64
            use_cross: true
          # macOS pre-built binaries are on the roadmap (TBD) but not
          # yet shipped — Apple Silicon notarisation + cross-compile
          # signing add operational cost we haven't justified yet.
          # README §Supported Platforms tracks the gap; users on
          # macOS are pointed at `./build.sh` for the time being.
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --bin genasis
          else
            cargo build --release --target ${{ matrix.target }} --bin genasis
          fi

      - name: Verify static linking
        run: |
          # musl-static binaries should report "statically linked" from
          # `file`; if a future Cargo.toml edit re-introduces a glibc
          # dep this guard catches it at release time instead of in the
          # field.
          BINARY="target/${{ matrix.target }}/release/genasis"
          file "$BINARY"
          if file "$BINARY" | grep -q "dynamically linked"; then
            echo "::error::$BINARY is dynamically linked — musl-static target should produce a fully static binary"
            exit 1
          fi

      - name: Package tarball + sha256
        run: |
          BINARY="target/${{ matrix.target }}/release/genasis"
          ASSET="${{ matrix.asset_name }}.tar.gz"
          tar -czf "$ASSET" -C "$(dirname "$BINARY")" genasis
          sha256sum "$ASSET" > "${ASSET}.sha256"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.tar.gz.sha256

  # Compatibility smoke test: run the freshly-built x86_64 musl binary
  # inside an older glibc container to confirm "any Linux" claim. We
  # don't gate the release on this; we just surface a clear failure if
  # the binary inadvertently grows a glibc dep again. debian:bullseye
  # ships glibc 2.31 (~Debian 11 / Ubuntu 20.04), so passing here means
  # ≥10-year-old distros are still served.
  compat-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: genasis-linux-x86_64
          path: artifacts/
      - name: Extract + run --version inside debian:bullseye
        run: |
          tar -xzf artifacts/genasis-linux-x86_64.tar.gz -C artifacts/
          docker run --rm -v "$PWD/artifacts:/w" debian:bullseye /w/genasis --version

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: List assets
        run: ls -lh artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/genasis-linux-x86_64.tar.gz
            artifacts/genasis-linux-x86_64.tar.gz.sha256
            artifacts/genasis-linux-aarch64.tar.gz
            artifacts/genasis-linux-aarch64.tar.gz.sha256
