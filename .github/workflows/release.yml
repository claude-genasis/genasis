name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  lint-i18n-strict:
    runs-on: ubuntu-latest
    name: i18n drift (HARD FAIL at tag time)
    steps:
      - uses: actions/checkout@v4
      - name: Reject Korean text in English source files
        run: |
          OFFENDERS=$(grep -rEnP "[\\x{AC00}-\\x{D7AF}]" \
               --include="*.md" --include="*.tera" --include="*.rs" --include="*.sh" \
               --include="*.yml" \
               --exclude="*.ko.md" \
               --exclude="ko.yml" \
               --exclude-dir="ko" --exclude-dir="target" --exclude-dir="node_modules" \
               . || true)
          if [ -n "$OFFENDERS" ]; then
            echo "::error::Korean text found in English source files:"
            echo "$OFFENDERS"
            exit 1
          fi
      - name: Mirror completeness (HARD FAIL)
        run: scripts/check-i18n-drift.sh --strict
      - name: i18n key parity (HARD FAIL)
        run: scripts/i18n-extract-keys.sh --strict

  build:
    needs: lint-i18n-strict
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: genasis-linux-x86_64
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset_name: genasis-linux-aarch64
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: genasis-macos-x86_64
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: genasis-macos-aarch64
            use_cross: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --bin genasis
          else
            cargo build --release --target ${{ matrix.target }} --bin genasis
          fi

      - name: Package tarball + sha256
        run: |
          BINARY="target/${{ matrix.target }}/release/genasis"
          ASSET="${{ matrix.asset_name }}.tar.gz"
          tar -czf "$ASSET" -C "$(dirname "$BINARY")" genasis
          sha256sum "$ASSET" > "${ASSET}.sha256"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: List assets
        run: ls -lh artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/genasis-linux-x86_64.tar.gz
            artifacts/genasis-linux-x86_64.tar.gz.sha256
            artifacts/genasis-linux-aarch64.tar.gz
            artifacts/genasis-linux-aarch64.tar.gz.sha256
            artifacts/genasis-macos-x86_64.tar.gz
            artifacts/genasis-macos-x86_64.tar.gz.sha256
            artifacts/genasis-macos-aarch64.tar.gz
            artifacts/genasis-macos-aarch64.tar.gz.sha256
