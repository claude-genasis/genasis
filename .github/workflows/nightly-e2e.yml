name: Nightly E2E (real servers)

# M20 — re-runs the README-parity E2E suite against the real Plane +
# Mattermost stack defined in servers/docker-compose.yml. Our CI's
# default `cargo test` already covers the trial-flavor path (M19); this
# workflow exercises the live server flavor end-to-end.
#
# Trigger:
#   - Scheduled: 02:00 UTC daily.
#   - Manual:    workflow_dispatch (for ad-hoc verification).
#
# Failure policy: opens (or comments on) a labelled issue automatically
# so the maintainer sees a green/red signal without polling Actions.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  real-servers:
    name: e2e against servers/docker-compose
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build genasis CLI
        run: cargo build --workspace --release

      - name: Seed servers/.env from CI defaults
        working-directory: servers
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          # Override the public-facing domain to localhost so the
          # in-CI Plane/MM containers expose URLs that genasis can
          # reach without DNS.
          sed -i 's#^PLANE_DOMAIN=.*#PLANE_DOMAIN=localhost#g' .env || true
          sed -i 's#^MM_DOMAIN=.*#MM_DOMAIN=localhost#g' .env || true

      - name: Bring up Plane + Mattermost
        working-directory: servers
        run: docker compose up -d

      - name: Wait for Plane + Mattermost to become healthy
        run: |
          # Mattermost ping is the single most reliable readiness probe.
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8065/api/v4/system/ping >/dev/null; then
              echo "Mattermost ready after ${i}0s"
              break
            fi
            sleep 10
          done
          for i in $(seq 1 90); do
            if curl -fsS http://localhost/ -o /dev/null; then
              echo "Plane web ready after ${i}0s"
              break
            fi
            sleep 10
          done

      - name: Run lifecycle E2E (catalog-mocked, trial-flavor agnostic)
        # The current M19 suite uses a mock catalog and does not depend
        # on a network Plane/MM. Running it here proves the released
        # binary is at least as healthy as in normal CI.
        run: cargo test --workspace --release --no-fail-fast

      - name: Smoke `genasis init --probe-only` against the live stack
        # Probe mode hits Plane health + MM ping without provisioning.
        # We accept either success (servers green) or a non-zero exit
        # (servers slow to come up); the nightly is a signal, not a gate.
        env:
          PLANE_API_KEY: ${{ secrets.PLANE_API_KEY }}
          MM_ADMIN_TOKEN: ${{ secrets.MM_ADMIN_TOKEN }}
        run: |
          mkdir -p /tmp/nightly-project
          cat > /tmp/nightly-project/genasis.toml <<'TOML'
          [project]
          name = "nightly"
          domain = "localhost"

          [plane]
          url = "http://localhost"
          workspace_slug = "nightly"
          flavor = "auto"

          [mattermost]
          url = "http://localhost:8065"
          team_name = "nightly"
          flavor = "auto"
          TOML
          ./target/release/genasis --non-interactive --yes init \
            --project /tmp/nightly-project --probe-only || \
            echo "::warning::probe-only init failed; servers may still be warming"

      - name: Tear down servers
        if: always()
        working-directory: servers
        run: docker compose down -v

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Nightly E2E failed — ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              `Nightly real-server E2E run failed.`,
              ``,
              `Workflow: ${context.workflow}`,
              `Run: ${context.runId}`,
              `Triggered by: ${context.eventName}`,
              ``,
              `Investigate at https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["nightly-real-servers"],
            });
