  refused: "%{count}개 파일이 거부됨 (Tampered/RoleMismatch). 위 diff 를 확인한 뒤 --force 로 다시 실행하거나 문제를 직접 수정하세요."
  wrote_summary: "%{count}개 파일 작성, %{backups}개 백업 생성"

detach:
